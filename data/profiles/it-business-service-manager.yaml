      - de: "Integration von Azure Services in Betriebsmodelle (Operating Models) inkl. RACI"
        en: "Integrated Azure services into operating models incl. RACI"
      - de: "Globale Cloud-Transformation: Migration von über 1000 Servern in über 50 Ländern auf Azure (Lift & Shift)"
        en: "Global cloud transformation: migrated 1000+ servers across 50+ countries to Azure (lift & shift)"
      - de: "Entwicklung von Zielarchitekturen für Azure gemeinsam mit Business- und IT-Stakeholdern"
        en: "Designed Azure target architectures together with business and IT stakeholders"
      - de: "Business Cases und Kosten-Nutzen-Vergleiche (u. a. Azure Hybrid Benefit); wöchentliche Kundenpräsentationen"
        en: "Business cases and cost-benefit comparisons (incl. Azure Hybrid Benefit); weekly client presentations"
      - de: "Globale Anbindung von SIEM- und Monitoring-Tools; Planung der schrittweisen Migration von Active Directory zu Entra ID"
        en: "Connected SIEM and monitoring tools globally; planned the phased migration from Active Directory to Entra ID"

  - id: initech
    summary:
      de: "Beratung in IT-Transformation und Cloud-Integration für ein Bundesamt und eine grosse Krankenversicherung."
      en: "Consulting on IT transformation and cloud integration for a federal office and a major health insurer."
    projects:
