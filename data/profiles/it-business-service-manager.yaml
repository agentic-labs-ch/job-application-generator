      de: "Teilprojektleitung Cloud-Architektur: vom Business Case über die Zielarchitektur bis zur Einbindung in das Betriebsmodell."
      en: "Sub-project lead for cloud architecture: from business case and target architecture to integration into the operating model."
    highlights:
