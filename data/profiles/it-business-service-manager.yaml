      - de: "Betreuung des Value Stream Cloud: Lösungsvorschläge und Prüfung der Architekturkonformität auf Basis des Microsoft-Azure-Servicekatalogs"
        en: "Supported the Cloud value stream: solution proposals and architecture compliance checks based on the Microsoft Azure service catalogue"
      - de: "Architektur für operative Resilienz, Cloud-Backup und Lifecycle-Management der IT-Infrastruktur"
