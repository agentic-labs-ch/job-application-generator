      - de: "Standards und Roadmaps gemäss ICT-Strategie; Prüfung von Vorhaben auf Architekturrelevanz; Trainingsmaterial sowie Präsentationen in internen und externen Gremien"
        en: "Standards and roadmaps aligned with the ICT strategy; reviewed projects for architecture relevance; training material and presentations at internal and external boards"

  - id: globex
