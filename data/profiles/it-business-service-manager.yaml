    highlights:
      - de: "Beratung von ICT-Projekten, Teamleitungen und CIO-Gremien, u. a. bei Beschaffung und Anbieterevaluation von IT-Produkten und Services"
        en: "Advised ICT projects, team leads and CIO boards, incl. procurement and vendor evaluation of IT products and services"
      - de: "Mitentwicklung der Cloud-Strategie und des Sourcing-Modells (IaaS, PaaS, SaaS, On-Prem) inkl. Business Cases, TCO- und CapEx/OpEx-Analysen"
