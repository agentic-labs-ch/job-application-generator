# Role version "IT Business Service Manager" (generic; not tied to one job ad).
# Public once merged into main, like everything in this file except `note` and `evidence`
# (never rendered, not confidential). Facts come only from ../cv.yaml. All skill levels are
# self-assessment proposals (level_proposed: true) pending owner review.
# Keyword analysis: ../pages/stichwortanalyse-it-business-service-manager.yaml

kind: profile
base: ../cv.yaml
id: it-business-service-manager
languages: [de, en]
target: { de: IT Business Service Manager, en: IT Business Service Manager }

omit: [certifications]   # owner 2026-09-23: no certificates on application pages
photo:   # owner 2026-09-23: this role version uses the photo in the white shirt
  src: portrait-2.jpg
  alt:
    de: Porträt von Alex Muster
    en: Portrait of Alex Muster
  width: 480
  height: 600
headline:
  de: "ICT-Architekt · Brücke zwischen Business, IT und Anbietern"
  en: "ICT Architect · Bridging business, IT and providers"

claim:
  de: >-
    Ich übersetze Business-Bedürfnisse in verlässliche IT-Services: von Zielarchitektur,
    Business Case und Anbieterevaluation bis zu Migration und Betriebsmodell mit klaren Rollen.
  en: >-
    I turn business needs into reliable IT services: from target architecture, business case
    and vendor evaluation to migration and an operating model with clear roles.

summary:
  de: >-
    Wirtschaftsinformatiker (MSc, Beispiel-Hochschule) an der Schnittstelle von Business und IT, mit Erfahrung
    in Bank, Beratung und Technologie. Bei der Beispiel Kantonalbank habe ich Standards und
    Roadmaps erarbeitet, die Cloud-Strategie und das Sourcing-Modell mitentwickelt und
    CIO-Gremien beraten, u. a. bei Beschaffung und Anbieterevaluation. Bei Globex Consulting führte ich
    ein Projektteam mit bis zu 12 Personen inkl. Termin- und Budgetverantwortung, arbeitete in
    einer globalen Cloud-Transformation (Migration von über 1000 Servern in über 50 Ländern auf
    Azure) und integrierte Azure Services in Betriebsmodelle inkl. RACI. Davor: API Management,
    Datenintegration und Release-Planung bei initech, Pre-Sales und Proofs of Concept bei Helix. Ich
    übersetze Technik in klare Entscheidungen und bringe Fachbereiche, IT und Anbieter auf einen
    gemeinsamen Plan.
  en: >-
    MSc in Business Information Technology (Beispiel-Hochschule), working at the interface between business
    and IT, with experience in banking, consulting and technology. At Beispiel Kantonalbank I
    developed standards and roadmaps, co-developed the cloud strategy and sourcing model and
    advised CIO boards, incl. on procurement and vendor evaluation. At Globex Consulting I led a project
    team of up to 12 people incl. schedule and budget responsibility, worked on a global cloud
    transformation (1000+ servers across 50+ countries migrated to Azure) and integrated Azure
    services into operating models incl. RACI. Before that: API management, data integration
    and release planning at initech; pre-sales and proofs of concept at Helix. I turn technology into
    clear decisions and bring business units, IT and providers onto a shared plan.

usp:
  - title: { de: Wofür ich stehe, en: What I stand for }
    text:
      de: >-
        Für IT-Services, die fachlich begründet, wirtschaftlich durchgerechnet und im Betrieb klar
        geregelt sind. Entscheide stütze ich auf Business Case, TCO und Standards – und halte
        fest, wer wofür verantwortlich ist.
      en: >-
        IT services that are justified by the business, properly costed and clearly organised in
        operation. I base decisions on business cases, TCO and standards – and record who is
        responsible for what.
  - title: { de: Zusammenarbeit mit mir, en: Working with me }
    text:
      de: >-
        Ich kläre Anforderungen direkt mit den Fachbereichen, mache Optionen vergleichbar und
        halte alle Beteiligten auf dem gleichen Stand – bei Globex Consulting etwa mit wöchentlichen
        Kundenpräsentationen. Wissen gebe ich weiter: mit Trainingsmaterial, Schulungen und der
        Einarbeitung neuer Teammitglieder.
      en: >-
        I clarify requirements directly with business units, make options comparable and keep
        everyone on the same page – at Globex Consulting, for example, through weekly client
        presentations. I pass on what I know: through training material, training sessions and
        onboarding new team members.
  - title: { de: Was Sie erwarten können, en: What you can expect }
    text:
      de: >-
        Entscheidungsvorlagen, die das Management nachvollziehen kann: Business Cases, Roadmaps
        und Migrationspläne. Dazu genug technische Tiefe, um Architekturen, Schnittstellen und
        Prototypen selbst zu beurteilen – aus Cloud-, Integrations- und Entwicklungsprojekten.
      en: >-
        Decision papers that management can follow: business cases, roadmaps and migration
        plans. Plus enough technical depth to assess architectures, interfaces and prototypes
        myself – from cloud, integration and development projects.

experience:
