  "Agile Methoden" at level 3, because cv.yaml shows agile work as a developer and in SAFe but no
  leading or facilitating agile teams. Overlapping items use the same levels as the
  ict-architect and product-manager versions. Not claimed (gaps, see keyword analysis): ITIL,
  SLA/KPI management and service reviews, contract management, HERMES, Jira/Confluence, ITSM
