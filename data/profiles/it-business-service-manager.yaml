          en: "Azure cloud and data integration for a major health insurer: concept, architecture and proof of concept to integrate an on-prem Oracle DB into Dynamics 365 (Azure Data Factory, Azure SQL, landing zone)"
    highlights:
      - de: "Technologien: API Management, Webservices, IAM, Azure, Java, Docker"
