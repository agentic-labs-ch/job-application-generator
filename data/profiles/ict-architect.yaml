note: >-
  Alle Stufen sind Vorschläge zur Selbsteinschätzung. Einträge aus dem Gesamtprofil behalten
  ihre Stufe (teils umbenannt). Einzige Abweichung: Scrum/Kanban steht dort auf 4 und ist hier
  mit SAFe (3) zu «Agile Methoden» auf Stufe 3 zusammengefasst, weil die Stationen die
  Anwendung agiler Methoden belegen, aber keine Leitung oder Schulung. Nicht übernommen, weil
  für die Rolle nachrangig oder ohne Beleg in den Stationen: Terraform, Linux, Python,
  JavaScript, Groovy und die Gruppe Daten & KI.
