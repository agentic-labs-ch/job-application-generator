  Kubernetes/Docker, SAFe, cloud strategy, business cases, enterprise architecture, operational
  resilience, project management, stakeholder advisory, presenting, analytical thinking, team
  leadership). Deviation: Scrum / Kanban 3 instead of 4, because the base shows team-member use
  (BZB, Swiss IT Services) but no Scrum Master, Product Owner or coaching role, and in a product
  role level 4 would suggest agile product ownership. Pre-sales (2) could be 3 if the owner
  confirms independent pre-sales work at Helix. No product ownership, product KPIs, pricing or
  go-to-market is claimed (gaps listed on the analysis page).
