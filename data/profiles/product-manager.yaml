  - id: initech
    summary:
      de: "Beratung in zwei Kundenprojekten mit Schwerpunkt Release-Planung, Stakeholder-Management und Cloud-Integration."
      en: "Consulting in two client projects focused on release planning, stakeholder management and cloud integration."
