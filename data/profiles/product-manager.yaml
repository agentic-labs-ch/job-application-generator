# Role version "Product Manager" (kind: profile) of ../cv.yaml. Public once merged, unlisted and
# noindex. Facts come only from the base dataset; wording is tailored to technical and platform
# product management (see ../pages/stichwortanalyse-product-manager.yaml). The owner has not held
# a Product Owner or Product Manager title: this version shows transferable evidence and claims
# no product ownership. Skill levels are self-assessment proposals pending owner review.

kind: profile
base: ../cv.yaml
id: product-manager
languages: [de, en]
target: { de: Product Manager, en: Product Manager }

omit: [certifications, activities]   # owner 2026-09-23: no certificates on application pages;
                                     # no Engagement (owner confirmed 2026-09-23)
headline:
  de: "Technisches Produktmanagement · Cloud- und Plattform-Services"
  en: "Technical Product Management · Cloud & Platform Services"

claim:
  de: >-
    Ich bringe Kundennutzen, Business Case und technische Machbarkeit zusammen – für Cloud- und
    Plattform-Services mit klarer Roadmap und tragfähigem Betriebsmodell.
  en: >-
    I bring customer value, business case and technical feasibility together – for cloud and
    platform services with a clear roadmap and a workable operating model.

summary:
  de: >-
    Enterprise- und Cloud-Architekt mit Erfahrung in Bank, Beratung und Technologie. Bei der
    Beispiel Kantonalbank betreute ich den Value Stream Cloud nach SAFe mit Lösungsvorschlägen auf
    Basis des Azure-Servicekatalogs, entwickelte Roadmaps gemäss ICT-Strategie, wirkte an
    Cloud-Strategie und Sourcing-Modell inklusive Business Cases und TCO-Analysen mit und beriet
    Projekte, Teamleitungen und CIO-Gremien. Bei Globex Consulting führte ich als Teilprojektleiter ein
    Team mit bis zu 12 Personen in einer globalen Cloud-Migration, mit Termin- und
    Budgetverantwortung; bei Helix arbeitete ich im Pre-Sales mit dem CTO von Helix Schweiz zusammen.
    Diese Erfahrung bringe ich ins technische Produktmanagement ein: für Cloud- und
    Plattform-Services, die Kundennutzen, Wirtschaftlichkeit und Betrieb verbinden.
  en: >-
    Enterprise and cloud architect with experience in banking, consulting and technology. At
    Beispiel Kantonalbank I supported the Cloud value stream in SAFe with solution proposals based
    on the Azure service catalogue, developed roadmaps aligned with the ICT strategy, co-developed
    the cloud strategy and sourcing model incl. business cases and TCO analyses, and advised
    projects, team leads and CIO boards. At Globex Consulting I led a team of up to 12 people as
    sub-project lead in a global cloud migration, with schedule and budget responsibility; at Helix
    I worked with the CTO of Helix Switzerland in pre-sales. I bring this experience to technical
    product management: cloud and platform services that combine customer value,
    cost-effectiveness and operations.

usp:
  - title: { de: Wofür ich stehe, en: What I stand for }
    text:
      de: >-
        Nachvollziehbare Entscheidungen: Ich mache Nutzen, Kosten und Varianten transparent, mit
        Business Cases, TCO- und CapEx/OpEx-Analysen und einem Sourcing-Modell für IaaS, PaaS,
        SaaS und On-Prem.
      en: >-
        Decisions people can follow: I make value, cost and options transparent, with business
        cases, TCO and CapEx/OpEx analyses and a sourcing model covering IaaS, PaaS, SaaS and
        on-prem.
  - title: { de: Zusammenarbeit mit mir, en: Working with me }
    text:
      de: >-
        Strukturiert und im Dialog: Ich bringe Fachbereiche, IT, Anbieter und Betrieb zusammen,
        übersetze zwischen Business- und Techniksprache und halte Ergebnisse in Roadmaps,
        Standards und Präsentationen fest.
      en: >-
        Structured and in dialogue: I bring business units, IT, vendors and operations together,
        translate between business and technical language and capture results in roadmaps,
        standards and presentations.
  - title: { de: Was Sie erwarten können, en: What you can expect }
    text:
      de: >-
        Technische Tiefe für Produktentscheide: Mit Architektur- und Cloud-Erfahrung spreche ich
        mit Engineering auf Augenhöhe, prüfe die Machbarkeit früh,
        wenn nötig mit einem Proof of Concept, und denke Sicherheit und Betrieb von Anfang an mit.
      en: >-
        Technical depth for product decisions: with architecture and cloud experience I talk to
        engineering as a peer, check feasibility early,
        with a proof of concept where needed, and consider security and operations from the start.

