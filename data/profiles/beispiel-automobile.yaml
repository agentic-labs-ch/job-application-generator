# Cover letter (AIDA), based on the owner's own draft and adapted to this ad.
letter:
  date: 2026-09-23
  place: Zürich
  recipient: ["Beispiel Automobile Schweiz AG", "IT-Abteilung", "Musterstrasse 55", "8000 Beispielstadt"]
  subject: "Bewerbung als IT Business Service Manager 100 %"
  salutation: "Sehr geehrtes Team"
  attention:
    - >-
      Autos und Technik sind seit Langem meine Leidenschaft. Als IT-Architekt und Solution
      Engineer treibt mich eine Frage an: Wie wird aus Technik echter Nutzen für das Geschäft?
      Bei der Beispiel Automobile Schweiz AG kommt beides zusammen: in einer Rolle, die technisches
      Verständnis, Projektleitung und Business-Nähe verbindet.
  interest:
    - >-
      Mich reizt, in einem kleinen, agilen IT-Team konzernweite Lösungen vor Ort einzuführen
      und lokale Digitalisierungs-, Automatisierungs- und Integrationsprojekte nahe am Business
      umzusetzen. Genau das suche ich: eine verantwortungsvolle Aufgabe mit klaren
      Schnittstellen zwischen IT und Fachbereich, in einem Umfeld, das Stabilität und
      Weiterentwicklung verbindet.
  desire:
    - "Was ich dafür mitbringe:"
    - points:
        - >-
          Architektur und Entscheidungsgrundlagen: Als ICT-Architekt der Beispiel Kantonalbank prüfte ich Vorhaben auf Architekturkonformität, entwickelte Standards und
          Roadmaps und beriet CIO-Gremien. Ich war für das IT-System-Inventar mitverantwortlich;
          meine Power-BI-Dashboards dienten Team und Management-Gremien als
          Entscheidungsgrundlage und zeigten etwa, dass gleiche Applikationen in verschiedenen
          Versionen installiert waren.
        - >-
          Governance und Sicherheit: Bei der Azure-Migration der Bank erweiterten wir die
          IT-Governance, um technische Schulden abzubauen, etwa mit Regeln für Frameworks und
          Programmiersprachen, die wir mit den DevOps-Teams definierten. Um Lösungsarchitekturen
          zu beurteilen, analysierte ich IT-Security-Komponenten im Detail.
        - >-
          Projektleitung und Integration: Bei Globex Consulting führte ich als Teilprojektleiter ein Team
          von bis zu 12 Personen mit Budgetverantwortung und gestaltete eine globale
          Azure-Migration mit. Bei initech war ich Team Lead für API Management und konzipierte die
          Integration einer Oracle-Datenbank in Dynamics 365 via Azure Data Factory, samt Proof
          of Concept.
        - >-
          Technische Tiefe und Prototypen: Lösungsideen prüfe ich gerne selbst. Mit dem
          KI-Coding-Assistenten Claude Code automatisiere ich Arbeiten in Office 365 und
          entwickle eine mobile Applikation; bei Helix setzte ich einen Proof of Concept für
          sicheres Access Management mit APIs und OAuth 2.0 um.
    - >-
      Ich arbeite agil wie klassisch, auch mit SAFe. Meine Arbeitsweise ist pragmatisch,
      strukturiert und teamorientiert: Ich erkenne Prioritäten schnell, verstehe zuerst das
      Geschäft, kommuniziere lösungsorientiert mit Fachstellen und achte auf stabile
      Betriebsprozesse.
  action:
    - >-
      Gerne zeige ich Ihnen in einem persönlichen Gespräch anhand konkreter Beispiele, wie ich
      Ihre Applikationslandschaft mitgestalten kann. Ich freue mich auf Ihre Einladung.
  closing: "Freundliche Grüsse"
  enclosures: "Lebenslauf, Arbeitszeugnisse und Diplome"

note: >-
  Letter based on the owner's own draft, adapted to this ad (AIDA). Skill levels are
  self-assessment proposals; gaps (Jira, Confluence, Windows Server, MS SQL Server, Power
  Platform beyond Power BI, automotive) are deliberately not claimed. See
  data/pages/stichwortanalyse-beispiel-automobile.yaml.
