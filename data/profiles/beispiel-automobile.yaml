# Application page for the job ad "IT Business Service Manager 100% (m/w/d)" at Beispiel Automobile
# Schweiz AG (jobs.example.com, published 2026-09-09): tailored CV (/beispiel-automobile/) and cover letter
# (/beispiel-automobile/anschreiben/), German only.
# Everything in this file is public once merged into `main`. `note` and `evidence` are never
# rendered, but they are not confidential either.
# Facts come from data/cv.yaml; the evidence id `letter` marks the owner's own professional
# statements from his letter draft. Skill levels are self-assessment proposals
# (level_proposed) pending owner review.

kind: profile
base: ../cv.yaml
id: beispiel-automobile
languages: [de]
target: IT Business Service Manager
omit: [certifications]   # owner 2026-09-23: no certificates on application pages
headline: "ICT-Architekt · Integration, Cloud & Projektleitung"
claim: >-
  Ich übersetze Business-Anforderungen in tragfähige Konzepte und Zielarchitekturen, leite die
  Umsetzung zwischen Fachbereich, IT und Partnern und validiere Lösungen bei Bedarf selbst mit
  einem Prototyp.
summary: >-
  Wirtschaftsinformatiker (MSc Beispiel-Hochschule) mit Erfahrung in Bank, Beratung und Technologie. Bei der
  Beispiel Kantonalbank habe ich als ICT-Architekt Vorhaben auf
  Architekturkonformität geprüft, Architekturen, Standards und Roadmaps entwickelt und mit
  Power-BI-Dashboards Entscheidungsgrundlagen für Team und Management-Gremien geschaffen. Bei
  Globex Consulting habe ich als Teilprojektleiter ein Team mit bis zu 12 Personen inkl. Termin- und
  Budgetverantwortung geführt und eine globale Azure-Migration mitgestaltet, bei initech als Team
  Lead API Management verantwortet und eine Datenintegration in Dynamics 365 konzipiert. Stärken:
  Vermitteln zwischen Business, IT und externen Partnern, analytisches Denken und pragmatische
  Lösungen, in agilen wie klassischen Projekten.
usp:
  - title: Wofür ich stehe
    text: >-
      Lösungen, die fachlich passen und technisch tragen. Ich nehme mir Zeit, das Geschäft zu
      verstehen, bewerte Optionen nach Architektur, Sicherheit, Kosten und Betrieb und mache
      Entscheidungen für Management und Fachbereich nachvollziehbar.
  - title: Zusammenarbeit mit mir
    text: >-
      Pragmatisch, strukturiert und teamorientiert. Ich erkenne Prioritäten schnell,
      kommuniziere lösungsorientiert mit Fachbereichen, IT und externen Partnern und bin in
      agilen wie klassischen Projekten zu Hause.
  - title: Was Sie erwarten können
    text: >-
      Klare Entscheidungsgrundlagen von Business Case und Zielarchitektur bis Roadmap,
      Projektleitung mit Blick auf Termine, Budget und stabilen Betrieb und bei Bedarf einen
      Prototyp, der eine Lösungsidee früh überprüfbar macht.

experience:
  - id: bkb
    summary: >-
      Als ICT-Architekt Bindeglied zwischen ICT-Projekten, Teamleitungen und
      CIO-Gremien: Lösungen bewerten, Standards setzen und Entscheidungen vorbereiten.
    highlights:
      - >-
        Prüfung von Vorhaben auf Architekturrelevanz und Konformität; Lösungsvorschläge auf Basis
        des Microsoft-Azure-Servicekatalogs (Value Stream Cloud)
      - >-
        Beratung von ICT-Projekten, Teamleitungen und CIO-Gremien, u. a. bei Beschaffung und
        Anbieterevaluation von IT-Produkten und Services
      - >-
        Mitverantwortung für das IT-System-Inventar; Power-BI-Dashboards als Entscheidungsgrundlage
        für Team und Management-Gremien, z. B. die Erkenntnis, dass in der gesamten IT
        unterschiedliche Versionen gleicher Applikationen installiert waren
      - >-
        Entwicklung und Pflege vorhabenübergreifender Enterprise- und ICT-Architekturen inkl.
        Standards und Roadmaps gemäss ICT-Strategie
      - >-
        Mitentwicklung der Cloud-Strategie und des Sourcing-Modells (IaaS, PaaS, SaaS, On-Prem)
        inkl. Business Cases, TCO- und CapEx/OpEx-Analysen
      - >-
        Erweiterung der IT-Governance im Team, um bei der Migration auf Azure technische Schulden
        abzubauen: Regeln mit den DevOps-Teams für Frameworks und Programmiersprachen, Hinweise
        auf Abweichungen von Standards, die die Komplexität erhöhen
      - >-
        Detaillierte Analyse von IT-Security-Komponenten zur Beurteilung von Lösungsarchitekturen
      - >-
        Zusammenarbeit mit Portfolio- und Projektmanagement zu Migrationsplänen und dem Cloud
        Target Operating Model; Arbeit nach SAFe
      - >-
        Architektur für operative Resilienz, Cloud-Backup und Lifecycle-Management der
        IT-Infrastruktur

  - id: globex
    summary: >-
      Teilprojektleitung Cloud-Architektur: Verantwortung für Team, Termine und Budget sowie
      Zielarchitekturen gemeinsam mit Business- und IT-Stakeholdern.
    highlights:
      - >-
        Führung eines Projektteams mit bis zu 12 Personen inkl. Termin- und Budgetverantwortung;
        Stellvertretung des Delivery Lead
      - >-
        Globale Cloud-Transformation: Migration von über 1000 Servern in über 50 Ländern auf Azure
        (Lift & Shift)
      - Entwicklung von Zielarchitekturen für Azure mit Business- und IT-Stakeholdern
      - >-
        Business Cases und Kosten-Nutzen-Vergleiche (u. a. Azure Hybrid Benefit) als
        Entscheidungsgrundlage; wöchentliche Kundenpräsentationen
      - Integration von Azure Services in Operating Models inkl. RACI
      - >-
        Design und Implementierung von Cloud-Security-Services (WAF, Load Balancer) sowie globale
        Anbindung von SIEM- und Monitoring-Tools
      - Planung der schrittweisen Migration von Active Directory zu Entra ID

  - id: initech
    summary: >-
      Technische Projektleitung, API Management und Datenintegration in agilen
      Beratungsprojekten für ein Bundesamt und eine grosse Krankenversicherung.
    projects:
      - start: 2019-10
        end: 2020-10
        description: >-
          Team Lead IT-Architektur, Engineering und API Management für die IT-Transformation
          eines Bundesamts: Projektmanagement inkl. Budget und Zeitplan, Release-Planung,
          Stakeholder-Management mit Behörden- und Partnerorganisationen, Einarbeitung von
          Mitarbeitenden
      - start: 2020-11
        end: 2021-02
        description: >-
          Datenintegration in der Azure-Cloud für eine grosse Krankenversicherung: Konzept und
          Architektur zur Integration einer On-Prem-Oracle-DB in Dynamics 365 (Azure Data
          Factory, Azure SQL, Landing Zone) inkl. Proof of Concept
    highlights:
      - "Technologien: API Management, Webservices, IAM, Azure, Java, Docker"

  - id: helix
    summary: >-
      Software Engineering und Technical Sales Support: Cloud, APIs und KI praktisch umgesetzt,
      vom Proof of Concept bis zur Lösung für einen Kunden.
    highlights:
      - Proof of Concept für eine sichere Access-Management-Lösung (APIs, OAuth 2.0)
      - Integration von Watson-KI-Services in einen Pepper-Roboter für einen Kunden bei Helix Research
      - Aufbau von Helix Cloud Private on-premise im eigenen Rechenzentrum (VMs, Kubernetes, Docker)
      - Zusammenarbeit mit dem CTO von Helix Schweiz im Pre-Sales
      - >-
        Blockchain-basierter Prozess für die Firmengründung in der Schweiz (Hyperledger,
        digitalswitzerland)
      - Cloud-Schulungen für das Sales-Team; technischer Experte an Hackathons

  - id: example-it-services
    highlights:
      - Entwicklung und Anpassung von SAP-ERP-Lösungen (ABAP) für Kunden in einem agilen Team
      - Optimierung von SQL-Abfragen für die Performance der Produktivdatenbank; Projektplanung

  - id: bzb
    highlights:
      - >-
        Migration des Zeitreihen-Analysesystems in Zusammenarbeit mit Ökonominnen und Ökonomen
        (Java, Groovy; Scrum, Kanban)

