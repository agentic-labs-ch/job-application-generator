letter:
  date: 2026-09-24
  place: Zürich
  recipient:
    [
      "Nimbus Software Schweiz GmbH",
      "Talent Acquisition",
      "Beispielplatz 2",
      "8000 Zürich"
    ]
  subject: "Application: Customer Success Account Manager (job number NS-2317)"
  salutation: "Dear Hiring Team"
  attention:
    - >-
      I have seen Azure adoption from both sides of the table. At Globex
      Consulting I helped deliver a global migration of more than 1,000 servers
      to Azure; at Beispiel Kantonalbank, as an ICT architect, I advised the CIO
      boards that decided, funded and governed the move to the cloud. As a
      Customer Success Account Manager, I want to bring both perspectives to
      your customers.
  interest:
    - >-
      Swiss enterprises in regulated industries decide on Azure the way Beispiel
      Kantonalbank did: through architecture reviews, business cases and CIO
      boards. I know that path from the inside, and I would like to help Nimbus
      Software's customers go down it faster, from cloud adoption to AI.
  desire:
    - "What I bring:"
    - points:
        - >-
          Trusted advice at board level: I have advised CIO boards and know what
          they weigh, from business priorities to procurement. I would use this
          to tie each customer's technology investments to the goals their
          leadership has set.
        - >-
          Success plans with measurable value: as an architect I backed cloud
          decisions with business cases and dashboards. I would build Customer
          Success Plans the same way, with shared objectives and success
          measures that the customer's governance can track.
        - >-
          Risks and dependencies: Azure migrations at Globex Consulting showed
          me where adoption stalls, from identity to operating models. I would
          raise these risks early and agree with the customer and the account
          team on who owns them.
        - >-
          Nimbus depth: the Azure Solutions Architect certification (AZ-305),
          and I know the Azure service catalogue from the customer's point of
          view.
  action:
    - >-
      I would welcome the opportunity to discuss how I would lead Customer
      Success Planning for your customers in Switzerland.
  closing: "Kind regards"
  enclosures: "References and diplomas"

note: >-
  Owner review. (1) Statements from the owner's work references that are not yet
  in data/cv.yaml: "resolved technical conflicts between business units" and
  talks at external boards (BKB Arbeitszeugnis); advice on cloud transformation
  strategies for clients in several industries, focus areas and contact with
  client executives and boards (Globex Consulting Zeugnis); coordination of
  stakeholders and developers on the Azure landing zone strategy, onboarding and
  coordination of new team members (initech Zeugnis). The Power BI finding is
  the owner's statement from the Beispiel Automobile page. (2) The job link is
  Nimbus Software's careers portal: the old job link redirects there; paste the
  exact link of the ad. (3) Certificates left out (owner decision 2026-09-23);
  AZ-305 is named once in the letter, since the ad lists Microsoft
  certifications as a plus; check that it is still active. (4) Gaps not claimed:
  formal customer success role, ITIL, PMI, Prosci; AI transformation only from
  Helix and as a skill.
