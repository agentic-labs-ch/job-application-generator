# Application for the ad "Beispielbank Karten AG - Senior Cloud Architect 80–100% (f/m/d)",
# Beispielstadt (job reference BB-7710; screenshot from the owner, 2026-09-24). English, like the
# ad. CV and motivation letter on one page in the order of docs/cv-guide.md, in Beispielbank colours.
# Everything in this file is public once merged into `main`. `note`, `evidence`,
# `job.requirements` and `brand.source` are never rendered, but they are not confidential either.
# Facts come from data/cv.yaml; statements marked in `note` come from the owner's work
# references (Arbeitszeugnisse) and wait for the owner's approval.

kind: application
base: ../cv.yaml
id: beispielbank-senior-cloud-architect
language: en
omit: [ certifications ] # owner 2026-09-23: no certificates on application pages
photo:
  src: portrait-2.jpg
  alt: Portrait of Alex Muster
  width: 480
  height: 600

job:
  title: "Senior Cloud Architect 80–100% (f/m/d)"
  company: Beispielbank Karten AG
  location: Beispielstadt
  reference: BB-7710
  url: https://example.com/jobs/BB-7710
  requirements:
    - text: "University degree in (business) informatics or similar"
      weight: must
      evidence: [ beispiel-hochschule-msc, beispiel-hochschule-bsc ]
    - text: "Hands-on experience with cloud architecture and the offerings of major
        hyperscalers in production"
      weight: must
      evidence: [ globex, bkb, initech, az-305 ]
      gap: "Azure only: AWS and other hyperscalers appear in no document and are not
        claimed."
    - text: "Underlying technologies: virtualisation, storage, DevOps"
      weight: must
      evidence: [ helix, globex, bkb ]
      gap: >-
        Virtualisation from Helix Cloud Private and the server migration; DevOps
        through governance with the DevOps teams. No hands-on pipeline work in
        the approved data.
    - text: "Understanding of the high regulatory requirements in banking and credit
        cards (PCI DSS, data residency)"
      weight: must
      evidence: [ bkb, bzb ]
      gap: >-
        Regulated banking (BKB, BZB) and operational resilience are evidenced;
        PCI DSS and data residency are named in no document and are not claimed.
    - text: "Quality and responsibility awareness; excellent communication in German
        and English"
      weight: must
      evidence: [ lang-de, lang-en, bkb, globex ]
    - text: "Design and implement cloud infrastructure for SaaS and PaaS according to
        regulation and best practice"
      weight: must
      evidence: [ bkb, globex ]
    - text: "Hybrid cloud platform architecture blueprint (SAD) incl. network,
        identity and security for Azure and AWS landing zones"
      weight: must
      evidence: [ globex, initech, bkb ]
      gap: "Azure only; the landing zone evidence is the coordination of a landing
        zone strategy at initech."
    - text: "Select and design platform services: compute, storage, monitoring,
        automation"
      weight: must
      evidence: [ globex, helix, bkb ]
    - text: "Coordinate roadmaps with the product owner, IT engineers and internal
        customers"
      weight: must
      evidence: [ bkb ]
    - text: "Gather and document cloud architecture principles, standards and
        best-practice guidelines"
      weight: must
      evidence: [ bkb ]
    - text: "Cloud governance framework in a new Cloud Center of Excellence, with
        cloud security specialists and engineers"
      weight: plus
      evidence: [ bkb, globex ]

brand:
  source: >-
    Fictional company (sample data), colours chosen for this sample.
  paper: "#ffffff"
  ink: "#000000"
  accent: "#0b5d6b"

# Branche (owner's model '4 Berufsfamilien x 4 Branchen', 2026-09-27): sets the page's typeface.
branche: finanz-oeffentlich
target: Senior Cloud Architect
headline: "Cloud & Enterprise Architect · Azure · Banking"
claim: >-
  Well-governed cloud platforms for banking, designed together with the teams
  who build and run them.
profile: >-
  Cloud and enterprise architect with an MSc in Business Information Technology
  (Beispiel-Hochschule) and over six years in IT consulting and enterprise
  architecture. At Beispiel Kantonalbank I co-developed the cloud strategy and
  sourcing model, advised the cloud value stream on solutions from the Azure
  service catalogue and designed the architecture for operational resilience,
  cloud backup and infrastructure lifecycle management. At Globex Consulting I
  designed Azure target architectures and cloud security services and took part
  in a global migration of 1,000+ servers across 50+ countries to Azure. Native
  German speaker, fluent in English.

strengths:
  - title: "Cloud platforms: Azure and private cloud"
    text: >-
      Azure target architectures with business and IT stakeholders; a global
      lift-and-shift of 1,000+ servers to Azure; Helix Cloud Private set up
      on-premise with VMs, Kubernetes and Docker.
    evidence: [ globex, helix ]
  - title: "Network, identity & security"
    text: >-
      Designed and implemented cloud security services (WAF, load balancer),
      connected SIEM and monitoring tools globally, planned the phased migration
      from Active Directory to Entra ID and analysed security components to
      assess solution architectures.
    evidence: [ globex, bkb ]
  - title: "Architecture governance at a bank"
    text: >-
      At Beispiel Kantonalbank: architecture standards and roadmaps,
      architecture compliance reviews of projects, governance rules agreed with
      the DevOps teams, and architecture for operational resilience and cloud
      backup.
    evidence: [ bkb ]

experience:
  - id: bkb
    summary: >-
      Senior architect in the bank's Architecture & Security unit: standards,
      roadmaps and cloud recommendations for projects and CIO boards.
    highlights:
      - >-
        Worked with portfolio and project management on migration plans and the
        cloud target operating model; SAFe
      - >-
        Advised the cloud value stream: architecture compliance and solution
        proposals based on the Microsoft Azure service catalogue
      - Architecture for operational resilience, cloud backup and IT
        infrastructure lifecycle management
      - >-
        Cross-project architecture standards and roadmaps aligned with the ICT
        strategy; reviewed projects for architecture relevance and compliance
      - >-
        Extended IT governance with the DevOps teams (rules for frameworks and
        programming languages) to reduce technical debt in the migration to
        Azure
  - id: globex
    summary: >-
      Advised clients in several industries on cloud transformation and
      delivered it, with a focus on cloud architecture, cybersecurity and
      project management.
    highlights:
      - Designed Azure target architectures with business and IT stakeholders
      - "Global cloud transformation: migrated 1,000+ servers across 50+
        countries to Azure (lift & shift)"
      - >-
        Designed and implemented cloud security services (WAF, load balancer);
        connected SIEM and monitoring tools globally
      - >-
        Planned the phased migration from Active Directory to Entra ID;
        integrated Azure services into operating models incl. RACI
      - >-
        Led a project team of up to 12 incl. schedule and budget responsibility;
        deputy to the delivery lead
  - id: initech
    summary: Consulting in cloud and integration projects for the public sector and
      a health insurer.
    projects:
      - start: 2019-10
        end: 2020-10
        description: >-
          Team lead for IT architecture, engineering and API management in a
          federal office's IT transformation: API management, IAM and release
          planning
      - start: 2020-11
        end: 2021-02
        description: >-
          Azure cloud integration for a major health insurer: coordinated
          stakeholders and developers on the new cloud integration strategy
          (Azure landing zone approach); architecture and proof of concept to
          integrate an on-prem Oracle DB into Dynamics 365 (Azure Data Factory,
          Azure SQL)
    highlights:
      - "Technologies: Azure, API management, IAM, Docker, Java"
  - id: helix
    highlights:
      - Set up Helix Cloud Private on-premise in Helix's data centre (VMs,
        Kubernetes, Docker)
      - Proof of concept for a secure access management solution (APIs, OAuth
        2.0)
  - id: example-it-services
    compact: true
  - id: bzb
    compact: true

knowledge:
  - name: "Cloud platform"
    items:
      - "Microsoft Azure (IaaS, PaaS)"
      - "Azure landing zones"
      - "Hybrid cloud (on-prem and Azure)"
      - "Azure Migrate, Site Recovery, Backup"
      - "Terraform (IaC)"
      - "Kubernetes / Docker"
      - "Linux (Ubuntu, RHEL)"
    evidence: [ globex, bkb, initech, helix ]
  - name: "Network, identity & security"
    items:
      - "VNet, Azure Firewall, WAF, Private Link, ExpressRoute"
      - "Entra ID / IAM"
      - "SIEM & monitoring"
      - "Defender for Cloud / Sentinel"
      - "OAuth 2.0, API security"
    evidence: [ globex, bkb, initech, helix ]
  - name: "Architecture & governance"
    items:
      - "Enterprise architecture (TOGAF, ArchiMate)"
      - "Architecture standards and roadmaps"
      - "Cloud and DevOps governance"
      - "Operational resilience"
      - "Business cases / TCO"
    evidence: [ bkb, beispiel-hochschule-bsc, globex ]
  - name: "Methods"
    items: [ "SAFe", "Scrum / Kanban", "Project management" ]
    evidence: [ bkb, globex, initech, bzb ]

interests: >-
  Travel and backpacking (Asia, South America, South Africa), football (7 years
  FC Beispiel), fitness, boxing, diving (PADI Advanced Open Water Diver)

letter:
  date: 2026-09-24
  place: Zürich
  recipient:
    [
      "Beispielbank Karten AG",
      "Recruiting",
      "Beispielweg 35",
      "8152 Beispielstadt"
    ]
  subject: "Application: Senior Cloud Architect 80–100% (job reference BB-7710)"
  salutation: "Dear Recruiting Team"
  attention:
    - >-
      A card business needs a cloud platform that is fast for product teams and
      stays under firm control. At Beispiel Kantonalbank I worked on both sides
      of this balance: architecture standards and governance rules agreed with
      the DevOps teams, and architecture for operational resilience and cloud
      backup. I would like to bring this experience to your new Cloud Center of
      Excellence.
  interest:
    - >-
      What draws me to the role is the chance to build a cloud foundation from
      the start: a new team, a hybrid platform blueprint in which network,
      identity and security are designed in from day one, and a governance
      framework shaped together with security specialists and engineers.
  desire:
    - "What I bring:"
    - points:
        - >-
          Azure architecture in production: at Globex Consulting I designed
          Azure target architectures and cloud security services (WAF, load
          balancer), connected SIEM and monitoring tools globally and planned
          the move from Active Directory to Entra ID. I also took part in a
          global migration of more than 1,000 servers to Azure.
        - >-
          Platform governance in a bank: at Beispiel Kantonalbank I advised the
          cloud value stream on solutions from the Azure service catalogue,
          reviewed projects against architecture standards and analysed security
          components to assess solution architectures.
        - >-
          Landing zones and integration: at initech I coordinated stakeholders
          and developers on a health insurer's cloud integration strategy based
          on an Azure landing zone, and designed the integration of an on-prem
          Oracle database into Dynamics 365, incl. a proof of concept.
        - >-
          Hands-on depth: Kubernetes and Docker at Helix and initech, Helix
          Cloud Private set up on-premise from virtual machines to containers,
          and the Azure Solutions Architect certification (AZ-305).
    - >-
      I work in a structured, reliable way and explain trade-offs clearly to
      engineers and decision makers.
  action:
    - >-
      I would welcome a conversation about how I can help shape your platform
      blueprint and cloud governance framework.
  closing: "Kind regards"
  enclosures: "References and diplomas"

note: >-
  Owner review. (1) Statements from the owner's work references that are not yet
  in data/cv.yaml: the unit "Architektur & Sicherheit" (BKB Arbeitszeugnis);
  advice on cloud transformation for clients in several industries, focus on
  cloud architecture, cybersecurity and project management (Globex Consulting
  Zeugnis); coordination of stakeholders and developers on the Azure landing
  zone strategy (initech Zeugnis). "Extended IT governance with the DevOps
  teams" and "analysed security components" are the owner's statements from the
  Beispiel Automobile page. (2) Certificates left out (owner decision
  2026-09-23); AZ-305 is named once in the letter, since the ad asks for
  hands-on hyperscaler experience (open point in STATUS.md); check that it is
  still active. (3) The ad asks to apply via its link, not via the red button.
  (4) Gaps not claimed: AWS, PCI DSS, data residency, hands-on DevOps pipelines.
