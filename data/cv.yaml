profile:
  name: Alex Muster
  headline:
    de: "ICT-Architekt · Cloud & Infrastruktur"
    en: "ICT Architect · Cloud & Infrastructure"
  location:
    de: "Zürich, Schweiz"
    en: "Zurich, Switzerland"
  summary:
    de: >-
      Enterprise- und Cloud-Architekt mit Erfahrung in Bank, Beratung und
      Technologie. Ich gestalte Zielarchitekturen und Cloud-Strategien, führe
      Architektur-Teams durch grosse Migrationen und übersetze Technik in klare
      Entscheidungen für Business und IT. Stärken: analytisches Denken,
      Lösungsdesign, Kundenorientierung, Teamfähigkeit.
    en: >-
      Enterprise and cloud architect with experience in banking, consulting and
      technology. I design target architectures and cloud strategies, lead
      architecture teams through large migrations and turn technology into clear
      decisions for business and IT. Strengths: analytical thinking, solution
      design, client focus, teamwork.
  links:
    - label:
        de: E-Mail
        en: Email
      url: mailto:alex.muster@example.com
    - label: LinkedIn
      url: https://example.com/alex-muster
    - label:
        de: Alle Lebensläufe
        en: All CVs
      url: https://agentic-labs-ch.github.io/job-application-generator/uebersicht/
  interests:
    de: >-
      Technologie, Politik, Reisen & Backpacking (Asien, Südamerika, Südafrika),
      Fussball (7 Jahre FC Beispiel), Fitness, Motorrad, Boxen; PADI Advanced
      Open Water Diver
    en: >-
      Technology, politics, travel & backpacking (Asia, South America, South
      Africa), football (7 years FC Beispiel), fitness, motorcycling, boxing;
      PADI Advanced Open Water Diver
  photo:
    src: portrait.jpg
    alt:
      de: Porträt von Alex Muster
      en: Portrait of Alex Muster
    width: 480
    height: 600
  note: Headline and summary are proposals pending owner review. Photo approved
    for publication by the owner on 2026-09-23.

